<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>簡訊多模板彈窗情境模擬</title>
<style>
  :root{--blue:#1769eb;--blue-soft:#eaf2ff;--ink:#111827;--muted:#60708b;--line:#d9dee7;--line-dark:#9aa4b2;--surface:#fff;--bg:#f3f5f8;--green:#18864b;--green-soft:#e8f7ee;--red:#d9363e;--red-soft:#fff0f1;--amber:#a66b00;--amber-soft:#fff8df}
  *{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}
  .app{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:58px minmax(0,1fr);grid-template-areas:"top top" "side main";min-height:100vh}
  .top{grid-area:top;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px}.logo{font:italic 800 23px Arial;color:#397de0}.title{font-size:17px;font-weight:800}.version{font:12px ui-monospace,Consolas,monospace;color:#64748b;background:#f3f5f8;padding:3px 7px;border-radius:4px}.top-note{margin-left:auto;color:#596a82;font-size:12px}
  .side{grid-area:side;background:#fff;border-right:1px solid var(--line);padding:20px 16px;overflow:auto}.side h1{font-size:18px;margin-bottom:5px}.side-sub{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:18px}.scenario-list{display:flex;flex-direction:column;gap:8px}.scenario{border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;padding:12px;transition:.18s}.scenario:hover{border-color:#8eb4f2}.scenario.active{border-color:var(--blue);background:#f5f8ff;box-shadow:0 0 0 2px #dbe8ff}.scenario strong{display:block;font-size:13px;margin-bottom:3px}.scenario span{font-size:11px;color:var(--muted);line-height:1.45}.scenario .tag{display:inline-block;margin-top:7px;border-radius:999px;padding:2px 7px;background:#eef2f7;color:#526078;font-size:10px;font-weight:800}.scenario .tag.red{background:var(--red-soft);color:var(--red)}.scenario .tag.amber{background:var(--amber-soft);color:var(--amber)}
  .main{grid-area:main;padding:24px 28px 50px;overflow:auto}.page-head{max-width:960px;margin:0 auto 15px;display:flex;align-items:flex-end;justify-content:space-between;gap:15px}.page-head h2{font-size:20px}.page-head p{font-size:12px;color:var(--muted);margin-top:3px}.logic-badge{font-size:11px;font-weight:800;color:#174f9f;background:#eaf2ff;border:1px solid #b8d1f8;border-radius:999px;padding:5px 10px;white-space:nowrap}
  .context{max-width:960px;margin:0 auto 14px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 14px;display:flex;align-items:center;gap:12px}.context-icon{width:32px;height:32px;border-radius:8px;background:#edf3fc;display:grid;place-items:center}.context-copy{flex:1}.context-copy strong{font-size:12.5px}.context-copy p{font-size:11.5px;color:var(--muted);margin-top:2px}.auto-source{font-size:10.5px;font-weight:800;border:1px solid #8eb4f2;background:#f4f8ff;color:#155ec8;border-radius:5px;padding:5px 8px}
  .modal{width:760px;max-width:100%;margin:0 auto;background:#fff;border:1px solid #abb4c0;border-radius:12px;box-shadow:0 18px 50px rgba(24,39,75,.2);overflow:hidden}.modal-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{font-size:16px}.manage{border:0;background:none;color:var(--blue);font-size:12px;font-weight:800}.modal-body{padding:15px 18px}.alert{display:none;border-left:4px solid;border-radius:7px;padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.55}.alert.show{display:block}.alert.danger{background:var(--red-soft);border-color:var(--red);color:#92242a}.alert.warning{background:var(--amber-soft);border-color:#d58a00;color:#6e4b00}.alert strong{display:block;margin-bottom:2px}
  .pin-wrap{display:none;margin-bottom:12px}.pin-wrap.show{display:block}.mini-label{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:6px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #a9bddc;background:#f6f9ff;color:#24528f;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800}.chip.active{border-color:var(--blue);background:#eaf2ff;color:#0c59ca}.chip .remembered{margin-left:5px;background:var(--green-soft);color:var(--green);border-radius:999px;padding:1px 5px;font-size:9px}
  .selector{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.left-col{border-right:1px solid var(--line);padding-right:16px}.filter{width:100%;height:36px;border:1px solid var(--line-dark);border-radius:6px;padding:7px 10px;margin-bottom:8px}.template-list{height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;background:#fafbfc;padding:6px}.tpl{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:10px;text-align:left;margin-bottom:4px}.tpl:hover{background:#fff;border-color:#c5d2e5}.tpl.active{background:#fff;border-color:var(--blue);box-shadow:0 0 0 2px #dbe8ff}.tpl-name{font-size:12px;font-weight:800;display:block}.tpl-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.tpl-tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px;background:#eef1f5;color:#56657a}.tpl-tag.custom{background:#edf5ff;color:#175cba}.tpl-tag.applying{background:#eaf2ff;color:#0e5dcc}.tpl-tag.last{background:var(--green-soft);color:var(--green)}.empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:11.5px}
  .field{margin-bottom:11px}.field label{display:block;font-size:11.5px;font-weight:800;margin-bottom:5px}.recipient{border:1px solid var(--line);border-radius:6px;background:#f8fafc;padding:8px 10px;font-size:11.5px;color:#536078}.recipient b{color:#111}.sms-body{width:100%;height:145px;border:1px solid var(--line-dark);border-radius:6px;padding:10px;resize:none;line-height:1.6}.sms-body:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #e4efff}.stats{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:10.5px;color:var(--muted)}.stats b{color:#111}.schedule{width:100%;height:35px;border:1px solid var(--line-dark);border-radius:6px;padding:5px 9px;color:#334155}
  .modal-foot{border-top:1px solid var(--line);padding:13px 18px;display:flex;justify-content:flex-end;gap:8px}.btn{border:1px solid var(--line-dark);border-radius:6px;background:#fff;padding:8px 15px;font-weight:800}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.danger{border-color:#e09195;color:#b02a31;background:#fff6f6}.current-rule{max-width:960px;margin:14px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.rule{border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px 10px;font-size:10.5px;color:var(--muted)}.rule b{display:block;color:#334155;margin-bottom:2px}.rule.active{border-color:#75a8f4;background:#f3f7ff}.toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-10px);background:#176b3a;color:#fff;border-radius:7px;padding:10px 18px;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:.2s;z-index:20}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
  @media(max-width:1000px){.app{grid-template-columns:220px minmax(0,1fr)}.main{padding:20px 16px}.modal{width:100%}}
  @media(max-width:760px){.app{display:block}.top{height:58px}.top-note{display:none}.side{border:0;border-bottom:1px solid var(--line)}.scenario-list{display:grid;grid-template-columns:repeat(2,1fr)}.selector{grid-template-columns:1fr}.left-col{border:0;padding:0}.template-list{height:240px}.current-rule{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><span class="logo">NPOS</span><span class="title">簡訊多模板彈窗情境模擬</span><span class="version">v7</span><span class="top-note">所有門市與客戶資料均為虛構示範</span></header>
  <aside class="side"><h1>發送情境</h1><p class="side-sub">切換情境查看西醫／中醫門市的模板分流、自動套用、防呆與顯示規則。</p><div class="scenario-list" id="scenarioList"></div></aside>
  <main class="main">
    <div class="page-head"><div><h2>預約簡訊發送</h2><p>左欄選模板、右欄立即看內容；清單維持展開，不需要來回收合。</p></div><span class="logic-badge">目前多模板版本</span></div>
    <div class="context"><div class="context-icon">🧩</div><div class="context-copy"><strong id="contextTitle"></strong><p id="contextDesc"></p></div><span class="auto-source" id="autoSource"></span></div>
    <section class="modal">
      <header class="modal-head"><h3>💬 套用簡訊模板</h3><button class="manage" id="manageBtn">管理模板 ↗</button></header>
      <div class="modal-body">
        <div class="alert" id="alertBox"></div>
        <div class="pin-wrap" id="pinWrap"><div class="mini-label">★ 釘選快速套用</div><div class="chips" id="chips"></div></div>
        <div class="selector">
          <div class="left-col"><input class="filter" id="filter" placeholder="篩選模板名稱…"><div class="template-list" id="templateList"></div></div>
          <div class="right-col">
            <div class="field"><label>收件人</label><div class="recipient" id="recipient"></div></div>
            <div class="field"><label>簡訊內容</label><textarea class="sms-body" id="smsBody"></textarea><div class="stats"><span>可直接編輯；切換模板前會確認是否覆蓋</span><span><b id="charCount">0</b> 字／<b id="segments">0</b> 則</span></div></div>
            <div class="field"><label>發送時間</label><input class="schedule" id="schedule" type="datetime-local" value="2026-08-12T09:00"></div>
          </div>
        </div>
      </div>
      <footer class="modal-foot"><button class="btn" id="cancelBtn">不發送</button><button class="btn primary" id="sendBtn">確認發送</button></footer>
    </section>
    <div class="current-rule"><div class="rule" data-rule="default"><b>1 門市預設</b>存在、未刪除且已啟用</div><div class="rule" data-rule="bu"><b>2 尚無自訂</b>套用門市體系 BU 指定</div><div class="rule" data-rule="last"><b>3 上次套用</b>僅這一層顯示沿用提示</div><div class="rule" data-rule="pin"><b>4 釘選／最新</b>最近釘選，否則最新建立</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  "use strict";
  const $=s=>document.querySelector(s);
  const samples={"門市名稱":"示範診所","預約日期":"08/12(三) ","預約時間":"10:30","門市地址":"XX市XX區XX路XX號","門市電話":"02-XXXX-XXXX","療程":"示範療程"};
  const templates={
    c1:{id:"c1",bu:"BU1",name:"西醫－標準預約提醒(本店版)",source:"自訂",body:"提醒您於「{{門市名稱}}」的預約：{{預約日期}}{{預約時間}}，地址{{門市地址}}，洽詢{{門市電話}}。"},
    c2:{id:"c2",bu:"BU1",name:"西醫－療程提醒(本店版)",source:"自訂",body:"溫馨提醒：您已預約{{預約日期}}{{預約時間}}的{{療程}}，請提前10分鐘至「{{門市名稱}}」報到。"},
    c3:{id:"c3",bu:"BU1",name:"西醫－改期聯絡版",source:"自訂",body:"您好，已為您保留{{預約日期}}{{預約時間}}預約，如需調整請來電{{門市電話}}。"},
    c4:{id:"c4",bu:"BU2",name:"中醫－預約門診提醒(本店版)",source:"自訂",body:"提醒您於「{{門市名稱}}」有中醫門診預約：{{預約日期}}{{預約時間}}，地址{{門市地址}}，洽詢{{門市電話}}。"},
    c5:{id:"c5",bu:"BU2",name:"中醫－回診提醒(本店版)",source:"自訂",body:"溫馨提醒：您已預約{{預約日期}}{{預約時間}}回診，請提前10分鐘至「{{門市名稱}}」報到。"},
    c6:{id:"c6",bu:"BU2",name:"中醫－改期聯絡版",source:"自訂",body:"您好，已為您保留{{預約日期}}{{預約時間}}中醫門診，如需調整請來電{{門市電話}}。"},
    b1:{id:"b1",bu:"BU1",name:"西醫－系統標準預約提醒",source:"系統內建",designated:true,body:"溫馨提醒您於「{{門市名稱}}」{{預約日期}}{{預約時間}}有預約，地址：{{門市地址}}，電話{{門市電話}}。"},
    b2:{id:"b2",bu:"BU1",name:"西醫－系統療程提醒",source:"系統內建",body:"提醒您於{{預約日期}}{{預約時間}}至「{{門市名稱}}」進行{{療程}}，如需調整請來電{{門市電話}}。"},
    b3:{id:"b3",bu:"BU2",name:"中醫－系統預約門診提醒",source:"系統內建",designated:true,body:"溫馨提醒您於「{{門市名稱}}」{{預約日期}}{{預約時間}}有中醫門診預約，地址：{{門市地址}}，電話{{門市電話}}。"},
    b4:{id:"b4",bu:"BU2",name:"中醫－系統回診提醒",source:"系統內建",body:"提醒您於{{預約日期}}{{預約時間}}至「{{門市名稱}}」回診，如需調整請來電{{門市電話}}。"}
  };
  const scenarios=[
    {id:"standard",title:"西醫標準發送",desc:"西醫門市已設預設模板",tag:"西醫／門市預設",mode:"default",bu:"BU1",pins:["c2"],custom:["c1","c2","c3"],selected:"c1"},
    {id:"last",title:"西醫未設門市預設",desc:"沿用個人上次使用",tag:"西醫／沿用上次",mode:"last",bu:"BU1",pins:["c1"],custom:["c1","c2","c3"],selected:"c2",remembered:true},
    {id:"new",title:"西醫新門市",desc:"尚無自訂，回退西醫 BU 指定",tag:"西醫 BU 指定",mode:"bu",bu:"BU1",pins:[],custom:[],selected:"b1"},
    {id:"tcm",title:"中醫標準發送",desc:"只顯示中醫模板；門市預設優先",tag:"中醫／門市預設",mode:"default",bu:"BU2",pins:["c5"],custom:["c4","c5","c6"],selected:"c4"},
    {id:"tcm-new",title:"中醫新門市",desc:"尚無自訂，回退中醫 BU 指定",tag:"中醫 BU 指定",mode:"bu",bu:"BU2",pins:[],custom:[],selected:"b3"},
    {id:"refuse",title:"客戶設定拒收",desc:"顯示阻擋警示，仍可強制發送",tag:"發送風險",tagClass:"red",mode:"default",bu:"BU1",pins:["c2"],custom:["c1","c2"],selected:"c1",alert:"danger"},
    {id:"multi",title:"同日多筆預約",desc:"以當日最早有效預約發送",tag:"排程提醒",tagClass:"amber",mode:"default",bu:"BU1",pins:["c2"],custom:["c1","c2","c3"],selected:"c1",alert:"warning"},
    {id:"guest",title:"99－虛擬會員新客",desc:"改用該筆預約的新客資料",tag:"新客收件人",mode:"default",bu:"BU1",pins:["c2"],custom:["c1","c2"],selected:"c1",guest:true}
  ];
  let current=scenarios[0],selectedId=current.selected,lastAppliedBody="",filter="";
  function resolve(body){return body.replace(/\{\{(.+?)\}\}/g,(m,k)=>samples[k]===undefined?m:samples[k])}
  function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),2200)}
  function scenarioButtons(){$("#scenarioList").innerHTML=scenarios.map(s=>`<button class="scenario${s.id===current.id?' active':''}" data-scenario="${s.id}"><strong>${s.title}</strong><span>${s.desc}</span><i class="tag ${s.tagClass||''}">${s.tag}</i></button>`).join("")}
  function activeTemplates(){return current.custom.map(id=>templates[id]).concat(Object.values(templates).filter(t=>t.source==="系統內建"&&t.bu===current.bu))}
  function applyTemplate(id,userAction=false){const t=templates[id];if(!t)return;if(userAction&&$("#smsBody").value!==lastAppliedBody&&!confirm("目前內容已手動修改，套用新模板將覆蓋這些修改，確定要更換嗎？"))return;selectedId=id;lastAppliedBody=resolve(t.body);$("#smsBody").value=lastAppliedBody;renderSelector();updateStats()}
  function renderSelector(){
    const pins=current.pins.filter(id=>current.custom.includes(id));$("#pinWrap").classList.toggle("show",pins.length>0);$("#chips").innerHTML=pins.map(id=>`<button class="chip${id===selectedId?' active':''}" data-apply="${id}">★ ${templates[id].name}${current.remembered&&id===selectedId?'<span class="remembered">沿用上次</span>':''}</button>`).join("");
    const list=activeTemplates().filter(t=>!pins.includes(t.id)&&t.name.toLowerCase().includes(filter.toLowerCase()));$("#templateList").innerHTML=list.length?list.map(t=>`<button class="tpl${t.id===selectedId?' active':''}" data-apply="${t.id}"><span class="tpl-name">${t.name}</span><span class="tpl-tags"><i class="tpl-tag ${t.source==='自訂'?'custom':''}">${t.source}</i>${t.designated?'<i class="tpl-tag applying">BU 指定</i>':''}${t.id===selectedId?'<i class="tpl-tag applying">套用中</i>':''}${current.remembered&&t.id===selectedId?'<i class="tpl-tag last">已沿用上次選擇</i>':''}</span></button>`).join(""):'<div class="empty">無符合的模板</div>';
  }
  function updateStats(){const n=$("#smsBody").value.length;$("#charCount").textContent=n;$("#segments").textContent=n?Math.ceil(n<=70?1:n/67):0}
  function renderScenario(){
    scenarioButtons();filter="";$("#filter").value="";selectedId=current.selected;const modeText={default:"自動套用：門市預設",last:"自動套用：上次選擇",bu:"自動套用：BU 指定"};$("#contextTitle").textContent=current.title;$("#contextDesc").textContent=current.desc;$("#autoSource").textContent=(current.bu==="BU2"?"中醫體系":"西醫體系")+"｜"+modeText[current.mode];
    $(".current-rule .active")?.classList.remove("active");$( `.rule[data-rule="${current.mode}"]`)?.classList.add("active");
    const alert=$("#alertBox");alert.className="alert";if(current.alert==="danger"){alert.classList.add("show","danger");alert.innerHTML="<strong>發送受阻</strong>客戶已設定「不要發送簡訊」，強制發送可能引起客訴。"}else if(current.alert==="warning"){alert.classList.add("show","warning");alert.innerHTML="<strong>同日有多筆預約</strong>系統以 08/12 10:30 的最早有效預約為主，下方可編輯發送內容。"}
    $("#recipient").innerHTML=current.guest?'<b>示範新客</b>　0900-000-000<br><span>99－虛擬會員：必須使用這筆預約的新客姓名與電話</span>':'<b>示範客戶</b>　0900-000-001';
    applyTemplate(selectedId,false);$("#sendBtn").textContent=current.alert==="danger"?"仍要確認發送":"確認發送";$("#sendBtn").className="btn "+(current.alert==="danger"?"danger":"primary");
  }
  $("#scenarioList").addEventListener("click",e=>{const b=e.target.closest("[data-scenario]");if(!b)return;current=scenarios.find(s=>s.id===b.dataset.scenario);renderScenario()});
  $("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-apply]");if(b)applyTemplate(b.dataset.apply,true)});$("#templateList").addEventListener("click",e=>{const b=e.target.closest("[data-apply]");if(b)applyTemplate(b.dataset.apply,true)});
  $("#filter").addEventListener("input",e=>{filter=e.target.value.trim();renderSelector()});$("#smsBody").addEventListener("input",updateStats);$("#sendBtn").addEventListener("click",()=>toast("✓ 簡訊已成功排程發送"));$("#cancelBtn").addEventListener("click",()=>toast("已取消發送"));$("#manageBtn").addEventListener("click",()=>toast("正式系統會跳轉至「簡訊模板設定」"));
  renderScenario();
})();
</script>
</body>
</html>
