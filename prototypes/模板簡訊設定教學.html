<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡訊模板設定（NPOS 模擬）</title>
<style>
  :root{
    --blue:#2563EB;--blue-deep:#1D4ED8;--blue-wash:#EAF1FE;
    --side:#26313f;--side-2:#2f3c4d;--side-text:#c2ccd6;--side-active:#3b86f7;
    --ink:#1f2933;--muted:#5b6770;--faint:#8a949c;
    --line:#e3e7eb;--line-strong:#cfd6dc;--surface:#fff;--surface-2:#f5f7f9;
    --danger:#dc3545;--danger-wash:#fdecec;--ok:#198754;
    --gold:#C98A14;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Microsoft JhengHei',-apple-system,"PingFang TC",sans-serif;background:var(--surface-2);color:var(--ink);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}

  .app{display:grid;grid-template-columns:1fr;grid-template-rows:52px 1fr;height:100vh;grid-template-areas:"top" "main"}
  .top{grid-area:top;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
  .top .np{font-weight:800;color:#1f6feb;font-size:17px;letter-spacing:.5px}
  .top .title{font-weight:600}
  .top .ver{font-size:11px;color:#fff;background:var(--ok);border-radius:5px;padding:2px 7px;font-weight:600}
  .top .vnum{font-size:11px;color:var(--faint)}
  .top .sp{flex:1}
  .top .user{display:flex;align-items:center;gap:9px}
  .top .user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#5b86e5,#36d1dc)}
  .top .user .nm{font-size:13px;font-weight:600;line-height:1.2}
  .top .user .dp{font-size:11px;color:var(--faint)}

  .main{grid-area:main;overflow:auto;padding:18px 22px 50px}
  .page-h{margin-bottom:14px}
  .page-h h1{font-size:20px;font-weight:700}
  .page-h p{font-size:13px;color:var(--muted);margin-top:2px}

  .card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card-h{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card-b{padding:16px}

  /* page header with inline toggles */
  .ph-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
  .ph-row>div:first-child{flex:1}
  .ph-toggles{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
  .sw-row:last-child{border-bottom:none}
  .sw-row .sl{font-weight:600;color:var(--ink);white-space:nowrap}
  .switch{width:44px;height:24px;border-radius:999px;background:#cfd6dc;position:relative;flex:none;transition:.2s;cursor:pointer}
  .switch.on{background:var(--blue)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch.on::after{transform:translateX(20px)}

  /* layout: list+editor | preview */
  .grid{display:grid;grid-template-columns:300px minmax(0,1fr) 360px;gap:16px;align-items:start}
  @media (max-width:1100px){.grid{grid-template-columns:1fr}}

  /* template list */
  .list-tools{display:flex;gap:8px;margin-bottom:10px}
  .search{flex:1;position:relative;display:flex;align-items:center}
  .search input{width:100%;font-size:13px;padding:8px 10px 8px 30px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2)}
  .search input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-wash)}
  .search svg{position:absolute;left:9px;width:14px;height:14px;color:var(--faint)}
  .add-btn{font-size:12.5px;font-weight:650;color:#fff;background:var(--blue);border-radius:8px;padding:8px 12px;white-space:nowrap}
  .add-btn:hover{background:var(--blue-deep)}
  .group-t{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--faint);text-transform:uppercase;margin:12px 4px 6px}
  .t-card{border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .t-card:hover{border-color:var(--line-strong)}
  .t-card.active{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
  .t-card.off{background:#f8fafb}
  .t-card.deleted{border-style:dashed}
  .t-top{display:flex;align-items:flex-start;gap:7px}
  .t-name{font-size:13px;font-weight:650;flex:1}
  .t-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
  .t-meta{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .t-status{display:inline-flex;align-items:center;justify-content:center;min-width:48px;font-size:10px;font-weight:750;border-radius:999px;padding:2px 7px;border:1px solid transparent;white-space:nowrap}
  .t-status.on{color:#137044;background:#e9f7ef;border-color:#b9e2ca}
  .t-status.off{color:#66717a;background:#f0f2f4;border-color:#d7dce0}
  .t-status.deleted{color:#a52b37;background:var(--danger-wash);border-color:#efbec3}
  .t-last{min-width:0;font-size:10.5px;color:var(--faint);line-height:1.55}
  .t-last span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .star{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
  .star:hover{background:var(--surface-2)}
  .star.pinned{color:var(--gold)}
  .star svg{width:16px;height:16px}
  .t-tag{font-size:10px;font-weight:700;color:var(--faint);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}

  /* editor */
  .ed-field{margin-bottom:13px}
  .ed-field label{display:block;font-size:12.5px;font-weight:650;margin-bottom:5px}
  .ed-input,.ed-area{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:13.5px;background:#fff}
  .ed-input:focus,.ed-area:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
  .ed-area{min-height:130px;resize:vertical;line-height:1.65}
  .ed-current{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:14px}
  .ed-current[hidden]{display:none}
  .ed-current-item{min-width:0}
  .ed-current-label{font-size:10.5px;color:var(--faint);font-weight:650;margin-bottom:1px}
  .ed-current-value{font-size:12px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:560px){.ed-current{grid-template-columns:1fr 1fr}.ed-current>.t-status{grid-column:1/-1;width:max-content}}
  .param-hint{font-size:11.5px;color:var(--faint);margin:9px 0 6px;font-weight:600}
  .param-row{display:flex;flex-wrap:wrap;gap:6px}
  .pchip{font-size:11.5px;font-weight:600;font-family:var(--mono);color:var(--blue-deep);background:var(--blue-wash);border:1px solid transparent;padding:5px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:5px}
  .pchip:hover{background:#dbe7fb}
  .pchip .d{width:6px;height:6px;border-radius:50%}
  .pchip .d.sys{background:var(--blue)}
  .ed-foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{font-size:13.5px;font-weight:650;padding:9px 16px;border-radius:8px}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-deep)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line-strong)}.btn-ghost:hover{background:var(--surface-2)}
  .btn-danger{background:#fff;color:var(--danger);border:1px solid #f0bcbc}.btn-danger:hover{background:var(--danger-wash)}
  .ed-enable{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;color:var(--muted)}

  /* preview */
  .pv-sample{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;line-height:1.6;margin-bottom:14px}
  .pv-sample b{color:var(--ink)}
  .phone{background:linear-gradient(180deg,#eef2f6,#e6ecf2);border-radius:18px;padding:14px 13px 16px;border:1px solid var(--line-strong)}
  .phone-bar{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-weight:600;padding:0 4px 12px}
  .sms-sender{display:block;width:max-content;margin:0 auto 12px;font-size:11px;color:var(--muted);font-weight:600;background:rgba(255,255,255,.7);padding:4px 12px;border-radius:999px}
  .bubble{background:#fff;border-radius:4px 16px 16px 16px;padding:13px 15px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.05);min-height:90px}
  .bubble .tok{background:var(--blue-wash);color:var(--blue-deep);border-radius:4px;padding:0 3px;font-weight:600}
  .bubble .ph{color:var(--faint)}
  .pv-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;text-align:center}
  .stat .n{font-size:18px;font-weight:720}.stat .n.over{color:var(--danger)}
  .stat .l{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:1px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--muted);margin-top:12px}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:14px;height:14px;border-radius:4px}
  .legend .sw.sys{background:var(--blue-wash);border:1px solid var(--blue)}

  .star.locked{opacity:.3;pointer-events:none}
  .t-tag.def{background:#fff8e1;color:#7a5400;border-color:#ffe082}
  .t-tag.bu{background:#e0f2f1;color:#00695c;border-color:#80cbc4}
  .btn-default{background:#fff8e1;color:#7a5400;border:1px solid #ffe082}.btn-default:hover{background:#fff0b3}
  .btn-default.is-default{background:#ffe082;color:#5c4200;font-weight:700}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2933;color:#fff;font-size:13px;font-weight:550;padding:11px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:.22s;z-index:90}
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

  /* 確認彈窗 */
  .scrim{position:fixed;inset:0;background:rgba(20,28,38,.5);opacity:0;visibility:hidden;transition:.2s;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
  .scrim.open{opacity:1;visibility:visible}
  .modal{background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.28);width:520px;max-width:100%;transform:translateY(-12px);transition:transform .22s;overflow:hidden}
  .modal.sm{width:380px}
  .scrim.open .modal{transform:translateY(0)}
  .m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .m-head h3{font-size:17px;font-weight:700}
  .m-body{padding:18px 20px;font-size:13.5px;line-height:1.7;color:var(--muted)}
  .m-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:flex-end}


  /* 啟用開關說明文字 */
  .ed-hint{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.5}
  .ed-enable.locked{opacity:.5;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .live-clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;letter-spacing:.5px}
  .reset-btn{font-size:12px;font-weight:650;color:var(--danger);background:var(--danger-wash);border:1px solid #f0bcbc;border-radius:7px;padding:5px 11px;white-space:nowrap}
  .reset-btn:hover{background:#fbdcdc}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="np">NPOS</span><span class="title">簡訊模板設定</span>
    <span class="ver">正式</span><span class="vnum">v2.48.0</span>
    <span class="sp"></span>
    <button class="reset-btn" id="resetBtn" title="清除本機示範資料，恢復成初始狀態">🔄 重置示範資料</button>
    <span class="live-clock" id="liveClock"></span>
    <div class="user"><div class="av"></div><div><div class="nm">鄭楷錚</div><div class="dp">資訊軟體開發課-台灣</div></div></div>
  </header>

  <main class="main">
    <div class="ph-row">
      <div class="page-h" style="margin-bottom:0">
        <h1>簡訊模板設定</h1>
        <p>維護全系統共用的預約簡訊模板；儲存後可於「預約操作」的發送簡訊彈窗直接套用。</p>
      </div>
      <div class="ph-toggles">
        <div class="sw-row">
          <span class="sl">發送預約簡訊</span>
          <div class="switch on" id="swMain" role="switch" aria-checked="true"></div>
        </div>
        <div class="sw-row">
          <span class="sl">含電訪/銷判斷</span>
          <div class="switch" id="swTele" role="switch" aria-checked="false"></div>
        </div>
        <div class="sw-row" title="示範用：切換本門市科別，觀察系統內建模板清單如何跟著換">
          <span class="sl">示範門市科別</span>
          <select id="storeBuSel" style="font-size:12.5px;padding:6px 9px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);font-family:inherit">
            <option value="BU1">西醫（BU1）</option>
            <option value="BU2">中醫（BU2）</option>
          </select>
        </div>
      </div>
    </div>

    <div class="grid">
      <!-- 左：模板清單 -->
      <div class="card">
        <div class="card-h">💬 模板清單</div>
        <div class="card-b">
          <div class="list-tools">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="searchInput" placeholder="搜尋名稱或用途…">
            </div>
            <button class="add-btn" id="addBtn">＋ 新增</button>
          </div>
          <div id="listScroll"></div>
        </div>
      </div>

      <!-- 中：編輯器 -->
      <div class="card">
        <div class="card-h" id="edTitle">編輯模板</div>
        <div class="card-b">
          <div class="ed-current" id="edCurrentInfo" hidden></div>
          <div class="ed-field"><label>模板名稱 <span style="color:var(--danger)">*</span></label><input class="ed-input" id="edName" placeholder="例如：醫美－療程提醒"></div>
          <div class="ed-field"><label>用途說明</label><input class="ed-input" id="edDesc" placeholder="一句話描述何時使用"></div>
          <div class="ed-field">
            <label>簡訊內容 <span style="color:var(--danger)">*</span></label>
            <textarea class="ed-area" id="edBody" placeholder="輸入內容，點下方參數插入游標位置…"></textarea>
            <div class="param-hint">點擊插入參數：</div>
            <div class="param-row" id="sysRow"></div>
          </div>
          <div class="ed-foot">
            <button class="btn btn-primary" id="saveBtn">儲存為共用模板</button>
            <button class="btn btn-ghost" id="newBtn">清空</button>
            <button class="btn btn-default" id="defaultBtn" style="display:none">設為門市預設</button>
            <button class="btn btn-danger" id="delBtn" style="display:none">刪除</button>
            <label class="ed-enable" id="edEnableWrap"><span>啟用</span><span class="switch on" id="edEnable" role="switch" aria-checked="true" style="width:42px;height:23px"></span></label>
          </div>
          <div class="ed-hint" id="edEnableHint"></div>
        </div>
      </div>

      <!-- 右：即時預覽 -->
      <div class="card">
        <div class="card-h">👁️ 即時預覽</div>
        <div class="card-b">
          <div class="pv-sample" id="pvSample"></div>
          <div class="phone">
            <div class="phone-bar"><span>09:00</span><span>NPOS</span></div>
            <span class="sms-sender" id="pvSender"></span>
            <div class="bubble" id="pvBubble"><span class="ph">選擇或編輯模板，此處即時預覽…</span></div>
          </div>
          <div class="pv-stats">
            <div class="stat"><div class="n" id="pvChars">0</div><div class="l">字數 / 70</div></div>
            <div class="stat"><div class="n" id="pvSegs">0</div><div class="l">預估簡訊則數</div></div>
          </div>
          <div class="legend">
            <span class="k"><span class="sw sys"></span>參數自動帶入預約資料</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="scrim" id="confirmScrim">
  <div class="modal sm">
    <div class="m-head"><h3 id="confirmTitle"></h3></div>
    <div class="m-body" id="confirmMsg"></div>
    <div class="m-foot">
      <button class="btn btn-ghost" id="confirmCancelBtn"></button>
      <button class="btn" id="confirmOkBtn"></button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var mem={};
  var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return mem[k]||null;}},
             set:function(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}};
  var KEY={custom:"npos_tpl_custom",pins:"npos_tpl_pins",recent:"npos_tpl_recent",last:"npos_tpl_last",
           swMain:"npos_sms_enabled",swTele:"npos_sms_tele",default:"npos_tpl_default",bu:"npos_store_bu"};
  function loadJSON(k,d){try{var v=store.get(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function saveJSON(k,v){store.set(k,JSON.stringify(v));}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  /* ---------- 日期 / 時間工具 ---------- */
  var WKDAYS=["日","一","二","三","四","五","六"];
  function pad2(n){return ("0"+n).slice(-2);}
  function todayShort(){var d=new Date();return pad2(d.getMonth()+1)+"/"+pad2(d.getDate())+"("+WKDAYS[d.getDay()]+")";}
  function nowSlotStr(){
    var d=new Date(),total=d.getHours()*60+d.getMinutes();
    var sm=Math.round(total/30)*30;sm=Math.min(Math.max(sm,9*60),21*60);
    return pad2(Math.floor(sm/60))+":"+pad2(sm%60);
  }
  function shiftFromTimeStr(t){var h=parseInt(t,10),m=parseInt((t.split(":")[1])||"0",10),tot=h*60+m;return tot<13*60?"早診":tot<17*60?"午診":"晚診";}
  var SHIFT_START={"早診":9*60+30,"午診":13*60,"晚診":17*60};
  function queueNoFromTimeStr(t){var h=parseInt(t,10),m=parseInt((t.split(":")[1])||"0",10),tot=h*60+m,st=SHIFT_START[shiftFromTimeStr(t)];return String(1+Math.max(0,Math.floor((tot-st)/15))*2);}
  function smsSegments(len){if(len===0)return 0;if(len<=70)return 1;return Math.ceil(len/67);}

  /* ---------- 範例資料（預覽用，跟隨真實時間） ---------- */
  var STORE_NAME="示範麗雅",STORE_ADDR="XX區XX路1號",STORE_PHONE="02-xxxx-xxxx",STORE_QUEUE_URL="https://callcall.me/6unCS2";
  var _sampleTime=nowSlotStr();
  var sample={
    "門市名稱":STORE_NAME,"門市地址":STORE_ADDR,"門市電話":STORE_PHONE,
    "預約日期":todayShort(),"預約時間":_sampleTime,
    "療程":"臉-超導(60分)","診間":"診一",
    "時段":shiftFromTimeStr(_sampleTime),"派號":queueNoFromTimeStr(_sampleTime),
    "叫號機網址":STORE_QUEUE_URL
  };

      this.className="btn btn-default is-default";
      renderList();
      toast("已將「"+(t?t.name:"")+"」設為門市預設");
    }
  });
  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show");},2400);}

  /* ---------- 確認彈窗 ---------- */
  function confirmDialog(opts,onOk){
    document.getElementById("confirmTitle").textContent=opts.title;
    document.getElementById("confirmMsg").innerHTML=opts.message;
    var ok=document.getElementById("confirmOkBtn"),cancel=document.getElementById("confirmCancelBtn"),scrim=document.getElementById("confirmScrim");
    ok.textContent=opts.okText||"確定";cancel.textContent=opts.cancelText||"取消";
    ok.className="btn "+(opts.danger?"btn-danger":"btn-primary");
    function close(){scrim.classList.remove("open");ok.onclick=null;cancel.onclick=null;scrim.onclick=null;}
    ok.onclick=function(){close();onOk();};
    cancel.onclick=close;
    scrim.onclick=function(e){if(e.target===scrim)close();};
    scrim.classList.add("open");
  }

  /* ---------- 離開頁面前警示未儲存變更 ---------- */
  window.addEventListener("beforeunload",function(e){if(isDirty()){e.preventDefault();e.returnValue="";}});

  /* ---------- 重置示範資料（測試/展示用） ---------- */
  var DEMO_KEYS=["npos_tpl_custom","npos_tpl_pins","npos_tpl_recent","npos_tpl_last","npos_tpl_default","npos_sms_enabled","npos_sms_tele","npos_store_bu"];
  document.getElementById("resetBtn").addEventListener("click",function(){
    confirmDialog({title:"重置示範資料？",message:"將清除所有自訂模板、釘選、門市預設與開關設定，恢復成初始示範狀態，此動作無法復原。",okText:"重置",cancelText:"取消",danger:true},function(){
      DEMO_KEYS.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
      location.reload();
    });
  });

  /* ---------- 示範門市科別切換（demo 用，模擬跨科別門市時系統內建模板清單的差異） ---------- */
  var storeBuSel=document.getElementById("storeBuSel");
  storeBuSel.value=STORE_BU;
  function switchStoreBu(bu){
    applyStoreBu(bu);
    store.set(KEY.bu,STORE_BU);
    storeBuSel.value=STORE_BU;
    renderList();
    loadIntoEditor(builtinInStore[0].id);
    toast("已切換示範門市科別為「"+(STORE_BU==="BU1"?"西醫":"中醫")+"」，系統內建模板清單同步更新");
  }
  storeBuSel.addEventListener("change",function(){
    var bu=storeBuSel.value;
    if(isDirty()){
      confirmDialog({title:"捨棄目前變更？",message:"目前編輯內容尚未儲存，切換門市科別將會遺失這些變更。",okText:"捨棄並切換",cancelText:"繼續編輯",danger:true},function(){switchStoreBu(bu);});
      storeBuSel.value=STORE_BU;
      return;
    }
    switchStoreBu(bu);
  });

  /* ---------- init ---------- */
  renderList();
  loadIntoEditor(builtinInStore[0].id);
})();
</script>
</body>
</html>
