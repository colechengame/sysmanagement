<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡訊模板設定（NPOS 模擬）</title>
<style>
  :root{
    --blue:#2563EB;--blue-deep:#1D4ED8;--blue-wash:#EAF1FE;
    --side:#26313f;--side-2:#2f3c4d;--side-text:#c2ccd6;--side-active:#3b86f7;
    --ink:#1f2933;--muted:#5b6770;--faint:#8a949c;
    --line:#e3e7eb;--line-strong:#cfd6dc;--surface:#fff;--surface-2:#f5f7f9;
    --danger:#dc3545;--danger-wash:#fdecec;--ok:#198754;
    --gold:#C98A14;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Microsoft JhengHei',-apple-system,"PingFang TC",sans-serif;background:var(--surface-2);color:var(--ink);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}

  .app{display:grid;grid-template-columns:1fr;grid-template-rows:52px 1fr;height:100vh;grid-template-areas:"top" "main"}
  .top{grid-area:top;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
  .top .np{font-weight:800;color:#1f6feb;font-size:17px;letter-spacing:.5px}
  .top .title{font-weight:600}
  .top .ver{font-size:11px;color:#fff;background:var(--ok);border-radius:5px;padding:2px 7px;font-weight:600}
  .top .vnum{font-size:11px;color:var(--faint)}
  .top .sp{flex:1}
  .top .user{display:flex;align-items:center;gap:9px}
  .top .user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#5b86e5,#36d1dc)}
  .top .user .nm{font-size:13px;font-weight:600;line-height:1.2}
  .top .user .dp{font-size:11px;color:var(--faint)}

  .main{grid-area:main;overflow:auto;padding:18px 22px 50px}
  .page-h{margin-bottom:14px}
  .page-h h1{font-size:20px;font-weight:700}
  .page-h p{font-size:13px;color:var(--muted);margin-top:2px}

  .card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card-h{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card-b{padding:16px}

  /* page header with inline toggles */
  .ph-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
  .ph-row>div:first-child{flex:1}
  .ph-toggles{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
  .sw-row:last-child{border-bottom:none}
  .sw-row .sl{font-weight:600;color:var(--ink);white-space:nowrap}
  .switch{width:44px;height:24px;border-radius:999px;background:#cfd6dc;position:relative;flex:none;transition:.2s;cursor:pointer}
  .switch.on{background:var(--blue)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch.on::after{transform:translateX(20px)}

  /* layout: list+editor | preview */
  .grid{display:grid;grid-template-columns:300px minmax(0,1fr) 360px;gap:16px;align-items:start}
  @media (max-width:1100px){.grid{grid-template-columns:1fr}}

  /* template list */
  .list-tools{display:flex;gap:8px;margin-bottom:10px}
  .search{flex:1;position:relative;display:flex;align-items:center}
  .search input{width:100%;font-size:13px;padding:8px 10px 8px 30px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2)}
  .search input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-wash)}
  .search svg{position:absolute;left:9px;width:14px;height:14px;color:var(--faint)}
  .add-btn{font-size:12.5px;font-weight:650;color:#fff;background:var(--blue);border-radius:8px;padding:8px 12px;white-space:nowrap}
  .add-btn:hover{background:var(--blue-deep)}
  .group-t{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--faint);text-transform:uppercase;margin:12px 4px 6px}
  .t-card{border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .t-card:hover{border-color:var(--line-strong)}
  .t-card.active{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
  .t-card.off{opacity:.55}
  .t-top{display:flex;align-items:flex-start;gap:7px}
  .t-name{font-size:13px;font-weight:650;flex:1}
  .t-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
  .t-meta{font-size:10.5px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
  .star{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
  .star:hover{background:var(--surface-2)}
  .star.pinned{color:var(--gold)}
  .star svg{width:16px;height:16px}
  .t-tag{font-size:10px;font-weight:700;color:var(--faint);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}

  /* editor */
  .ed-field{margin-bottom:13px}
  .ed-field label{display:block;font-size:12.5px;font-weight:650;margin-bottom:5px}
  .ed-input,.ed-area{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:13.5px;background:#fff}
  .ed-input:focus,.ed-area:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
  .ed-area{min-height:130px;resize:vertical;line-height:1.65}
  .param-hint{font-size:11.5px;color:var(--faint);margin:9px 0 6px;font-weight:600}
  .param-row{display:flex;flex-wrap:wrap;gap:6px}
  .pchip{font-size:11.5px;font-weight:600;font-family:var(--mono);color:var(--blue-deep);background:var(--blue-wash);border:1px solid transparent;padding:5px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:5px}
  .pchip:hover{background:#dbe7fb}
  .pchip .d{width:6px;height:6px;border-radius:50%}
  .pchip .d.sys{background:var(--blue)}
  .ed-foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{font-size:13.5px;font-weight:650;padding:9px 16px;border-radius:8px}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-deep)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line-strong)}.btn-ghost:hover{background:var(--surface-2)}
  .btn-danger{background:#fff;color:var(--danger);border:1px solid #f0bcbc}.btn-danger:hover{background:var(--danger-wash)}
  .ed-enable{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;color:var(--muted)}

  /* preview */
  .pv-sample{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;line-height:1.6;margin-bottom:14px}
  .pv-sample b{color:var(--ink)}
  .phone{background:linear-gradient(180deg,#eef2f6,#e6ecf2);border-radius:18px;padding:14px 13px 16px;border:1px solid var(--line-strong)}
  .phone-bar{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-weight:600;padding:0 4px 12px}
  .sms-sender{display:block;width:max-content;margin:0 auto 12px;font-size:11px;color:var(--muted);font-weight:600;background:rgba(255,255,255,.7);padding:4px 12px;border-radius:999px}
  .bubble{background:#fff;border-radius:4px 16px 16px 16px;padding:13px 15px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.05);min-height:90px}
  .bubble .tok{background:var(--blue-wash);color:var(--blue-deep);border-radius:4px;padding:0 3px;font-weight:600}
  .bubble .ph{color:var(--faint)}
  .pv-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;text-align:center}
  .stat .n{font-size:18px;font-weight:720}.stat .n.over{color:var(--danger)}
  .stat .l{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:1px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--muted);margin-top:12px}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:14px;height:14px;border-radius:4px}
  .legend .sw.sys{background:var(--blue-wash);border:1px solid var(--blue)}

  /* 其他門市模板 */
  .t-card.ext{background:#f8fbff;border-color:#d6e4f7}
  .t-card.ext:hover{border-color:#a8c7ef}
  .t-card.ext.active{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
  .t-tag.ext{background:#e3f0ff;color:#1565c0;border-color:#b3d4f5}
  .t-store-badge{font-size:9.5px;color:#4a7ab5;background:#eaf2ff;border-radius:4px;padding:1px 6px;font-weight:600;display:inline-block;margin-top:4px}
  .star.ext-star{opacity:.3;pointer-events:none}
  /* 唯讀 banner */
  .ed-ro-bar{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#795800;margin-bottom:12px;display:flex;align-items:center;gap:8px;line-height:1.4}
  .ed-ro-bar b{color:#5c4200}
  .btn-copy{background:#e3f0ff;color:#1565c0;border:1px solid #b3d4f5}
  .btn-copy:hover{background:#cce0ff}
  .ed-input[readonly],.ed-area[readonly]{background:var(--surface-2);color:var(--muted);cursor:default}
  .ed-input[readonly]:focus,.ed-area[readonly]:focus{border-color:var(--line-strong);box-shadow:none}
  .t-tag.def{background:#fff8e1;color:#7a5400;border-color:#ffe082}
  .btn-default{background:#fff8e1;color:#7a5400;border:1px solid #ffe082}.btn-default:hover{background:#fff0b3}
  .btn-default.is-default{background:#ffe082;color:#5c4200;font-weight:700}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2933;color:#fff;font-size:13px;font-weight:550;padding:11px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:.22s;z-index:90}
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .live-clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;letter-spacing:.5px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="np">NPOS</span><span class="title">簡訊模板設定</span>
    <span class="ver">正式</span><span class="vnum">v2.48.0</span>
    <span class="sp"></span>
    <span class="live-clock" id="liveClock"></span>
    <div class="user"><div class="av"></div><div><div class="nm">鄭楷錚</div><div class="dp">資訊軟體開發課-台灣</div></div></div>
  </header>

  <main class="main">
    <div class="ph-row">
      <div class="page-h" style="margin-bottom:0">
        <h1>簡訊模板設定</h1>
        <p>維護全系統共用的預約簡訊模板；儲存後可於「預約操作」的發送簡訊彈窗直接套用。</p>
      </div>
      <div class="ph-toggles">
        <div class="sw-row">
          <span class="sl">發送預約簡訊</span>
          <div class="switch on" id="swMain" role="switch" aria-checked="true"></div>
        </div>
        <div class="sw-row">
          <span class="sl">含電訪/銷判斷</span>
          <div class="switch" id="swTele" role="switch" aria-checked="false"></div>
        </div>
      </div>
    </div>

    <div class="grid">
      <!-- 左：模板清單 -->
      <div class="card">
        <div class="card-h">💬 模板清單</div>
        <div class="card-b">
          <div class="list-tools">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="searchInput" placeholder="搜尋名稱或用途…">
            </div>
            <button class="add-btn" id="addBtn">＋ 新增</button>
          </div>
          <div id="listScroll"></div>
        </div>
      </div>

      <!-- 中：編輯器 -->
      <div class="card">
        <div class="card-h" id="edTitle">編輯模板</div>
        <div class="card-b">
          <div class="ed-ro-bar" id="edRoBar" style="display:none"></div>
          <div class="ed-field"><label>模板名稱 <span style="color:var(--danger)">*</span></label><input class="ed-input" id="edName" placeholder="例如：醫美－療程提醒"></div>
          <div class="ed-field"><label>用途說明</label><input class="ed-input" id="edDesc" placeholder="一句話描述何時使用"></div>
          <div class="ed-field">
            <label>簡訊內容 <span style="color:var(--danger)">*</span></label>
            <textarea class="ed-area" id="edBody" placeholder="輸入內容，點下方參數插入游標位置…"></textarea>
            <div class="param-hint">點擊插入參數：</div>
            <div class="param-row" id="sysRow"></div>
          </div>
          <div class="ed-foot">
            <button class="btn btn-primary" id="saveBtn">儲存為共用模板</button>
            <button class="btn btn-ghost" id="newBtn">清空</button>
            <button class="btn btn-default" id="defaultBtn" style="display:none">設為門市預設</button>
            <button class="btn btn-copy" id="copyBtn" style="display:none">複製到本門市</button>
            <button class="btn btn-danger" id="delBtn" style="display:none">刪除</button>
            <label class="ed-enable"><span>啟用</span><span class="switch on" id="edEnable" role="switch" aria-checked="true" style="width:42px;height:23px"></span></label>
          </div>
        </div>
      </div>

      <!-- 右：即時預覽 -->
      <div class="card">
        <div class="card-h">👁️ 即時預覽</div>
        <div class="card-b">
          <div class="pv-sample" id="pvSample"></div>
          <div class="phone">
            <div class="phone-bar"><span>09:00</span><span>NPOS</span></div>
            <span class="sms-sender">示範麗雅</span>
            <div class="bubble" id="pvBubble"><span class="ph">選擇或編輯模板，此處即時預覽…</span></div>
          </div>
          <div class="pv-stats">
            <div class="stat"><div class="n" id="pvChars">0</div><div class="l">字數 / 70</div></div>
            <div class="stat"><div class="n" id="pvSegs">0</div><div class="l">預估簡訊則數</div></div>
          </div>
          <div class="legend">
            <span class="k"><span class="sw sys"></span>參數自動帶入預約資料</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var mem={};
  var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return mem[k]||null;}},
             set:function(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}};
  var KEY={custom:"npos_tpl_custom",pins:"npos_tpl_pins",recent:"npos_tpl_recent",last:"npos_tpl_last",
           swMain:"npos_sms_enabled",swTele:"npos_sms_tele",default:"npos_tpl_default"};
  function loadJSON(k,d){try{var v=store.get(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function saveJSON(k,v){store.set(k,JSON.stringify(v));}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  /* ---------- 日期 / 時間工具 ---------- */
  var WKDAYS=["日","一","二","三","四","五","六"];
  function pad2(n){return ("0"+n).slice(-2);}
  function todayShort(){var d=new Date();return pad2(d.getMonth()+1)+"/"+pad2(d.getDate())+"("+WKDAYS[d.getDay()]+")";}
  function nowSlotStr(){
    var d=new Date(),total=d.getHours()*60+d.getMinutes();
    var sm=Math.round(total/30)*30;sm=Math.min(Math.max(sm,9*60),21*60);
    return pad2(Math.floor(sm/60))+":"+pad2(sm%60);
  }
  function shiftFromTimeStr(t){var h=parseInt(t,10),m=parseInt((t.split(":")[1])||"0",10),tot=h*60+m;return tot<13*60?"早診":tot<17*60?"午診":"晚診";}
  var SHIFT_START={"早診":9*60+30,"午診":13*60,"晚診":17*60};
  function queueNoFromTimeStr(t){var h=parseInt(t,10),m=parseInt((t.split(":")[1])||"0",10),tot=h*60+m,st=SHIFT_START[shiftFromTimeStr(t)];return String(1+Math.max(0,Math.floor((tot-st)/15))*2);}
  function smsSegments(len){if(len===0)return 0;if(len<=70)return 1;return Math.ceil(len/67);}

  /* ---------- 範例資料（預覽用，跟隨真實時間） ---------- */
  var _sampleTime=nowSlotStr();
  var sample={
    "會員姓名":"王○○","門市名稱":"示範麗雅","門市地址":"XX區XX路1號","門市電話":"02-xxxx-xxxx",
    "預約日期":todayShort(),"預約時間":_sampleTime,
    "療程":"臉-超導(60分)","診間":"診一",
    "時段":shiftFromTimeStr(_sampleTime),"派號":queueNoFromTimeStr(_sampleTime)
  };
  var SYS=[["會員姓名","會員姓名"],["門市名稱","預約門市"],["預約日期","預約日期"],["預約時間","預約時間"],["療程","施做療程"],["診間","診間"],["時段","時段"],["派號","派號"],["門市地址","門市地址"],["門市電話","門市電話"]];

  /* ---------- 模板資料（與預約操作頁共用 localStorage） ---------- */
  var builtin=[
    {id:"b1",name:"標準預約提醒",desc:"通用預約確認簡訊",enabled:true,
     body:"提醒您有預約【{{門市名稱}}】{{預約日期}}{{預約時間}}{{門市地址}}，有任何疑問請撥打{{門市電話}}，{{門市名稱}}關心您。"},
    {id:"b2",name:"醫美－療程提醒",desc:"醫美療程前報到提醒",enabled:true,
     body:"{{會員姓名}}您好，提醒您於{{門市名稱}}的{{療程}}預約：{{預約日期}}{{預約時間}}。請提前30分鐘蒞臨現場報到。洽詢{{門市電話}}。"},
    {id:"b4",name:"中醫－門診提醒",desc:"中醫門診當日提醒",enabled:true,
     body:"{{會員姓名}}您好，提醒您今日於{{門市名稱}}有門診預約{{預約時間}}，請依現場叫號順序看診。洽詢{{門市電話}}。"}
  ];
  var ext=[
    {id:"e1",name:"示範精緻美容－預約提醒",desc:"示範精緻美容門市自訂",enabled:true,storeId:"s2",storeName:"示範精緻美容",
     body:"{{會員姓名}}您好，示範精緻美容提醒您{{預約日期}}{{預約時間}}的{{療程}}預約，請準時蒞臨。洽詢{{門市電話}}。"},
    {id:"e2",name:"示範光采－療程確認",desc:"示範光采門市自訂",enabled:true,storeId:"s3",storeName:"示範光采",
     body:"{{會員姓名}}您好，提醒您{{預約日期}}於示範光采的{{療程}}預約，時間{{預約時間}}。地址：{{門市地址}}。"}
  ];
  var custom=loadJSON(KEY.custom,[]);
  var pins=loadJSON(KEY.pins,[]);
  var defaultTplId=store.get(KEY.default)||null;
  function allTpl(){return custom.concat(ext).concat(builtin);}
  function tplById(id){var a=allTpl();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
  function isCustom(id){return id&&id.indexOf("c")===0;}
  function isExt(id){return id&&id.indexOf("e")===0;}
  function todayStr(){var d=new Date();return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();}

  /* ---------- 全域開關 ---------- */
  var swMain=document.getElementById("swMain"),swTele=document.getElementById("swTele");
  if(store.get(KEY.swMain)==="0")swMain.classList.remove("on");
  if(store.get(KEY.swTele)==="1")swTele.classList.add("on");
  function bindSwitch(el,key){el.addEventListener("click",function(){el.classList.toggle("on");var on=el.classList.contains("on");el.setAttribute("aria-checked",on);store.set(key,on?"1":"0");toast(el===swMain?(on?"已開啟發送預約簡訊":"已關閉發送預約簡訊"):(on?"已納入「接受電訪/銷」判斷":"已取消「接受電訪/銷」判斷"));});}
  bindSwitch(swMain,KEY.swMain);bindSwitch(swTele,KEY.swTele);

  /* ---------- 預覽 ---------- */
  var pvBubble=document.getElementById("pvBubble"),pvChars=document.getElementById("pvChars"),pvSegs=document.getElementById("pvSegs");
  function resolved(body){return body.replace(/\{\{(.+?)\}\}/g,function(m,k){if(sample[k]!==undefined)return sample[k];return m;});}
  function previewHTML(body){
    var out="",re=/\{\{(.+?)\}\}/g,last=0,m;
    while((m=re.exec(body))){
      out+=esc(body.slice(last,m.index));var k=m[1];
      if(sample[k]!==undefined)out+='<span class="tok">'+esc(sample[k])+'</span>';
      else out+=esc(m[0]);
      last=re.lastIndex;
    }
    out+=esc(body.slice(last));return out;
  }
  function updatePreview(){
    var body=document.getElementById("edBody").value;
    if(!body.trim()){pvBubble.innerHTML='<span class="ph">選擇或編輯模板，此處即時預覽…</span>';pvChars.textContent="0";pvChars.className="n";pvSegs.textContent="0";return;}
    pvBubble.innerHTML=previewHTML(body);
    var plain=resolved(body);
    pvChars.textContent=plain.length;pvChars.className="n"+(plain.length>70?" over":"");
    pvSegs.textContent=smsSegments(plain.length);
  }
  document.getElementById("pvSample").innerHTML='已套用範例資料：會員 <b>'+esc(sample["會員姓名"])+'</b>／<b>'+esc(sample["門市名稱"])+'</b>／'+esc(sample["預約日期"])+' '+esc(sample["預約時間"])+'（'+esc(sample["時段"])+'第'+esc(sample["派號"])+'號）／'+esc(sample["療程"]);

  /* ---- 即時時鐘 ---- */
  function pad2c(n){return ("0"+n).slice(-2);}
  function updateClock(){var now=new Date(),el=document.getElementById("liveClock");if(el)el.textContent=pad2c(now.getHours())+":"+pad2c(now.getMinutes())+":"+pad2c(now.getSeconds());}
  updateClock();setInterval(updateClock,1000);

  /* ---------- 參數插入 ---------- */
  function pchip(k,man){return '<button class="pchip'+(man?' man':'')+'" data-token="{{'+k+'}}"><span class="d '+(man?'man':'sys')+'"></span>{{'+k+'}}</button>';}
  document.getElementById("sysRow").innerHTML=SYS.map(function(s){return pchip(s[0],false);}).join("");
  function insertToken(tok){
    var ta=document.getElementById("edBody"),s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
    ta.value=v.slice(0,s)+tok+v.slice(e);ta.focus();ta.selectionStart=ta.selectionEnd=s+tok.length;updatePreview();
  }
  document.querySelectorAll(".param-row").forEach(function(r){r.addEventListener("click",function(e){var b=e.target.closest("[data-token]");if(b)insertToken(b.getAttribute("data-token"));});});
  document.getElementById("edBody").addEventListener("input",updatePreview);

  /* ---------- 模板清單 ---------- */
  var search="",editingId=null;
  function matches(t){if(!search)return true;var q=search.toLowerCase();return t.name.toLowerCase().indexOf(q)>-1||(t.desc||"").toLowerCase().indexOf(q)>-1;}
  function starSVG(f){return '<svg viewBox="0 0 24 24" fill="'+(f?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.1 6.47L12 17.9l-5.8 3.05 1.1-6.47L2.6 9.9l6.5-.95z"/></svg>';}
  function cardHTML(t){
    var pinned=pins.indexOf(t.id)>-1,cust=isCustom(t.id),ext_t=isExt(t.id);
    return '<div class="t-card'+(ext_t?' ext':'')+(t.id===editingId?' active':'')+(t.enabled===false?' off':'')+'" data-edit="'+t.id+'">'+
      '<div class="t-top"><div style="flex:1"><div class="t-name">'+esc(t.name)+'</div>'+
      (t.desc?'<div class="t-desc">'+esc(t.desc)+'</div>':'')+
      (cust?'<div class="t-meta">'+esc(t.creator||"自訂")+' · '+esc(t.created||"")+'</div>':'')+
      (ext_t?'<div class="t-store-badge">'+esc(t.storeName||"")+'</div>':'')+
      '</div><button class="star'+(pinned?' pinned':'')+(ext_t?' ext-star':'')+'" data-pin="'+t.id+'" aria-label="釘選">'+starSVG(pinned)+'</button></div>'+
      '<div style="display:flex;justify-content:flex-end;gap:4px;margin-top:7px">'+
      (t.id===defaultTplId?'<span class="t-tag def">預設</span>':'')+
      '<span class="t-tag'+(ext_t?' ext':'')+'">'+
      (cust?"本門市自訂":ext_t?"其他門市":"系統內建")+'</span></div></div>';
  }
  function renderList(){
    var pinnedAll=allTpl().filter(function(t){return pins.indexOf(t.id)>-1&&matches(t);});
    var pinnedIds=pinnedAll.map(function(t){return t.id;});
    var mine=custom.filter(function(t){return pinnedIds.indexOf(t.id)<0&&matches(t);});
    var extList=ext.filter(function(t){return pinnedIds.indexOf(t.id)<0&&matches(t);});
    var builtinList=builtin.filter(function(t){return pinnedIds.indexOf(t.id)<0&&matches(t);});
    var h="",empty=!pinnedAll.length&&!mine.length&&!extList.length&&!builtinList.length;
    if(pinnedAll.length)h+='<div class="group-t">★ 釘選</div>'+pinnedAll.map(cardHTML).join("");
    if(mine.length)h+='<div class="group-t">本門市自訂</div>'+mine.map(cardHTML).join("");
    if(extList.length)h+='<div class="group-t">其他門市</div>'+extList.map(cardHTML).join("");
    if(builtinList.length)h+='<div class="group-t">系統內建</div>'+builtinList.map(cardHTML).join("");
    if(empty)h='<div style="font-size:12px;color:var(--faint);padding:4px">無符合的模板</div>';
    document.getElementById("listScroll").innerHTML=h;
  }
  document.getElementById("listScroll").addEventListener("click",function(e){
    var p=e.target.closest("[data-pin]");
    if(p){var id=p.getAttribute("data-pin");if(pins.indexOf(id)>-1)pins=pins.filter(function(x){return x!==id;});else pins.unshift(id);saveJSON(KEY.pins,pins);renderList();toast(pins.indexOf(id)>-1?"已釘選":"已取消釘選");return;}
    var ed=e.target.closest("[data-edit]");if(ed)loadIntoEditor(ed.getAttribute("data-edit"));
  });
  document.getElementById("searchInput").addEventListener("input",function(e){search=e.target.value.trim();renderList();});

  /* ---------- 編輯器載入/儲存 ---------- */
  var edName=document.getElementById("edName"),edDesc=document.getElementById("edDesc"),edBody=document.getElementById("edBody"),edEnable=document.getElementById("edEnable"),delBtn=document.getElementById("delBtn"),edTitle=document.getElementById("edTitle");
  function setEnable(on){edEnable.classList.toggle("on",on);edEnable.setAttribute("aria-checked",on);}
  edEnable.addEventListener("click",function(){edEnable.classList.toggle("on");edEnable.setAttribute("aria-checked",edEnable.classList.contains("on"));});

  function loadIntoEditor(id){
    var t=tplById(id);if(!t)return;
    editingId=id;
    var cust=isCustom(id),ext_t=isExt(id);
    edName.value=t.name;edDesc.value=t.desc||"";edBody.value=t.body;setEnable(t.enabled!==false);
    edName.readOnly=ext_t;edDesc.readOnly=ext_t;edBody.readOnly=ext_t;
    var edRoBar=document.getElementById("edRoBar"),copyBtn=document.getElementById("copyBtn"),saveBtn=document.getElementById("saveBtn"),newBtn=document.getElementById("newBtn");
    if(ext_t){
      edTitle.textContent="檢視模板（其他門市）";
      edRoBar.innerHTML='⚠ 此為「<b>'+esc(t.storeName||"其他門市")+'</b>」的模板，僅供檢視。若需使用請複製至本門市後再編輯。';
      edRoBar.style.display="";
    }else if(cust){
      edTitle.textContent="編輯模板（本門市自訂）";
      edRoBar.style.display="none";
    }else{
      edTitle.textContent="編輯模板（系統內建 · 儲存將另存為自訂）";
      edRoBar.style.display="none";
    }
    saveBtn.style.display=ext_t?"none":"";
    newBtn.style.display=ext_t?"none":"";
    copyBtn.style.display=ext_t?"":"none";
    delBtn.style.display=cust?"":"none";
    var defaultBtn=document.getElementById("defaultBtn");
    defaultBtn.style.display=ext_t?"none":"";
    defaultBtn.textContent=id===defaultTplId?"✓ 已是門市預設":"設為門市預設";
    defaultBtn.className="btn btn-default"+(id===defaultTplId?" is-default":"");
    updatePreview();renderList();
  }
  function newTemplate(){
    editingId=null;edName.value="";edDesc.value="";edBody.value="";setEnable(true);
    edName.readOnly=false;edDesc.readOnly=false;edBody.readOnly=false;
    edTitle.textContent="新增模板";
    document.getElementById("edRoBar").style.display="none";
    document.getElementById("saveBtn").style.display="";
    document.getElementById("newBtn").style.display="";
    document.getElementById("copyBtn").style.display="none";
    document.getElementById("defaultBtn").style.display="none";
    delBtn.style.display="none";
    updatePreview();renderList();
  }
  document.getElementById("newBtn").addEventListener("click",newTemplate);
  document.getElementById("addBtn").addEventListener("click",function(){newTemplate();edName.focus();});

  document.getElementById("saveBtn").addEventListener("click",function(){
    var name=edName.value.trim(),desc=edDesc.value.trim(),body=edBody.value.trim(),enabled=edEnable.classList.contains("on");
    if(!name){toast("請輸入模板名稱");edName.focus();return;}
    if(!body){toast("請輸入簡訊內容");edBody.focus();return;}
    if(isCustom(editingId)){
      var t=tplById(editingId);t.name=name;t.desc=desc||"自訂模板";t.body=body;t.enabled=enabled;
      saveJSON(KEY.custom,custom);toast("已更新「"+name+"」");
    }else{
      var id="c"+Date.now();
      custom.push({id:id,name:name,desc:desc||"自訂模板",body:body,enabled:enabled,creator:"系統人員",created:todayStr(),scenario:"預約簡訊"});
      saveJSON(KEY.custom,custom);editingId=id;
      edTitle.textContent="編輯模板（自訂）";delBtn.style.display="";
      toast("已儲存「"+name+"」為共用模板，預約頁即可套用");
    }
    renderList();
  });
  document.getElementById("delBtn").addEventListener("click",function(){
    if(!isCustom(editingId))return;
    var t=tplById(editingId);custom=custom.filter(function(x){return x.id!==editingId;});saveJSON(KEY.custom,custom);
    pins=pins.filter(function(x){return x!==editingId;});saveJSON(KEY.pins,pins);
    toast("已刪除「"+(t?t.name:"")+"」");newTemplate();
  });
  document.getElementById("defaultBtn").addEventListener("click",function(){
    if(editingId===defaultTplId){
      // 已是預設 → 取消預設
      defaultTplId=null;
      store.set(KEY.default,"");
      this.textContent="設為門市預設";
      this.className="btn btn-default";
      renderList();
      toast("已取消門市預設模板，將改為沿用上次套用");
    }else{
      // 不是預設 → 設為預設
      defaultTplId=editingId;
      store.set(KEY.default,defaultTplId);
      var t=tplById(defaultTplId);
      this.textContent="✓ 已是門市預設";
      this.className="btn btn-default is-default";
      renderList();
      toast("已將「"+(t?t.name:"")+"」設為門市預設");
    }
  });
  document.getElementById("copyBtn").addEventListener("click",function(){
    var t=tplById(editingId);if(!t)return;
    var id="c"+Date.now();
    custom.push({id:id,name:t.name+"（複製）",desc:t.desc||"",body:t.body,enabled:true,creator:"系統人員",created:todayStr()});
    saveJSON(KEY.custom,custom);
    toast("已複製「"+t.name+"」至本門市，可進行編輯");
    loadIntoEditor(id);
  });

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show");},2400);}

  /* ---------- init ---------- */
  renderList();
  loadIntoEditor(builtin[0].id);
})();
</script>
</body>
</html>
